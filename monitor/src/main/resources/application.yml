server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: flight-monitor
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

monitor:
  upstream-polling-enabled: false
  data-directory: ${MONITOR_DATA_DIRECTORY:/var/lib/flight-monitor}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    kafka:
      enabled: false
  info:
    env:
      enabled: false
info:
  app:
    name: Flight Monitor
    description: Local monitor skeleton; feature processing is not enabled.
